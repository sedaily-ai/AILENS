<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AI LENS — 4 페르소나 시선 (네 가지 결) -->
  <defs>
    <clipPath id="circle">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <!-- TL: blue (NT 분석) -->
    <rect x="0"  y="0"  width="32" height="32" fill="#3B82F6"/>
    <!-- TR: red (NF 의미) -->
    <rect x="32" y="0"  width="32" height="32" fill="#EF4444"/>
    <!-- BL: green (ST 실용) -->
    <rect x="0"  y="32" width="32" height="32" fill="#10B981"/>
    <!-- BR: amber (SF 공감) -->
    <rect x="32" y="32" width="32" height="32" fill="#F59E0B"/>
  </g>
  <!-- 4분할 라인 (흰 십자) -->
  <line x1="32" y1="2"  x2="32" y2="62" stroke="#fff" stroke-width="3.5"/>
  <line x1="2"  y1="32" x2="62" y2="32" stroke="#fff" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#fff" stroke-width="0.5"/>
</svg>
