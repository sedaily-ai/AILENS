<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="lens">
      <circle cx="200" cy="315" r="90"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafbfc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 좌측 로고 마크 -->
  <g clip-path="url(#lens)">
    <rect x="110" y="225" width="90"  height="90" fill="#3B82F6"/>
    <rect x="200" y="225" width="90"  height="90" fill="#EF4444"/>
    <rect x="110" y="315" width="90"  height="90" fill="#10B981"/>
    <rect x="200" y="315" width="90"  height="90" fill="#F59E0B"/>
  </g>
  <line x1="200" y1="225" x2="200" y2="405" stroke="#fff" stroke-width="6"/>
  <line x1="110" y1="315" x2="290" y2="315" stroke="#fff" stroke-width="6"/>

  <!-- 우측 카피 -->
  <text x="340" y="245" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-weight="800" font-size="64" fill="#1a1a1a" letter-spacing="-2">
    AI LENS
  </text>
  <text x="340" y="320" font-family="'Noto Serif KR', serif" font-size="42" fill="#374151" letter-spacing="-1.2">
    같은 뉴스, 네 가지 시선.
  </text>
  <text x="340" y="380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#6b7280">
    민철 · 하은 · 준서 · 소율 — 네 명의 AI 에디터가
  </text>
  <text x="340" y="412" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#6b7280">
    같은 사건을 각자의 결로 다시 씁니다.
  </text>

  <!-- 푸터 발행처 -->
  <text x="340" y="500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#9ca3af" letter-spacing="2">
    서울경제 · ailens.sedaily.ai
  </text>
</svg>
