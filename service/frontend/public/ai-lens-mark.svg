<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112" role="img" aria-label="AI LENS">
  <!--
    AI LENS 심볼 — 피그마 "AI LENS — Splash" 핸드오프 §2 지오메트리 그대로.
    전체 112×112 · 조각 54×54 · 갭 4px(십자) · 각 조각의 바깥쪽 모서리에만
    radius 54 → 정사각형이 사분원이 된다.
    조각 좌표: 0~54 / 58~112 (그 사이 4px 이 갭).
    각 path 는 "바깥 모서리 반대편 꼭짓점을 중심으로 한 사분원"이다.

    정지 사용(파비콘·OG·문서)용 에셋이고, 스플래시에서 움직이는 마크는 순수
    CSS(splash.css 의 .ails__piece 4개)로 그린다 — 이미지 로딩을 기다리지
    않고 첫 프레임부터 그려지게 하려는 핸드오프 §5 결정.
  -->
  <!-- 좌상 Blue — 중심 (54,54) -->
  <path d="M0 54A54 54 0 0 1 54 0L54 54Z" fill="#4285f4" />
  <!-- 우상 Red — 중심 (58,54) -->
  <path d="M58 0A54 54 0 0 1 112 54L58 54Z" fill="#ea4335" />
  <!-- 우하 Amber — 중심 (58,58) -->
  <path d="M112 58A54 54 0 0 1 58 112L58 58Z" fill="#f5a623" />
  <!-- 좌하 Green — 중심 (54,58) -->
  <path d="M54 112A54 54 0 0 1 0 58L54 58Z" fill="#4fb27b" />
</svg>
